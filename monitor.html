<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbita · Classifica</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body class="tv">
    <main class="board">
      <section class="scores" aria-labelledby="hs-title">
        <h1 class="logo">ORBITA</h1>
        <h2 id="hs-title" class="hs-title">HIGH SCORES · OGGI <span id="hs-page" class="hs-page"></span></h2>
        <div class="hs-head" aria-hidden="true"><span>POS</span><span>NOME</span><span>PUNTI</span><span>VIA</span></div>
        <ol id="leaderboard" class="leaderboard"></ol>
        <p id="last" class="last" aria-live="polite"></p>
      </section>

      <aside class="side">
        <div id="record" class="record"></div>

        <section aria-labelledby="live-title">
          <h2 id="live-title" class="side-title">IN VOLO ADESSO</h2>
          <ul id="devices" class="devices"></ul>
        </section>

        <dl id="totals" class="totals"></dl>

        <section aria-labelledby="duel-title">
          <h2 id="duel-title" class="side-title">SFIDA TRA DISPOSITIVI</h2>
          <ol id="duel" class="duel"></ol>
        </section>

        <div class="qrs">
          <figure class="qr-card">
            <div id="qr-play" class="qr" aria-hidden="true"></div>
            <figcaption><span class="qr-label play">GIOCA DAL TELEFONO</span><span class="qr-sub">punteggi in questa classifica</span></figcaption>
          </figure>
          <figure class="qr-card">
            <div id="qr" class="qr" aria-hidden="true"></div>
            <figcaption><span id="qr-label" class="qr-label"></span><span id="course" class="qr-sub"></span></figcaption>
          </figure>
        </div>
      </aside>

      <footer class="feed"><ul id="feed"></ul></footer>
    </main>

    <div id="takeover" class="takeover" hidden>
      <p id="takeover-kicker" class="takeover-kicker">NUOVO RECORD DELLA FIERA</p>
      <p id="takeover-name" class="takeover-name"></p>
      <p id="takeover-score" class="takeover-score"></p>
    </div>

    <p id="offline" class="offline" hidden>SERVER NON RAGGIUNGIBILE · RICONNESSIONE...</p>
    <div class="scanlines" aria-hidden="true"></div>
    <script type="module" src="/src/client/tv/main.ts"></script>
  </body>
</html>
